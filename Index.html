    <style>
        :root {
          --bg-color: #f4f7f6;
          --card-bg: #ffffff;
          --text-color: #000000;
          --header-color: #004d40;
          --primary-color: #00796b;
          --accent-color: #ffc107;
          --green: #4CAF50;
          --red: #F44336;
          --orange: #FF9800;
          --neutral: #9E9E9E;
        }
        body {
          font-family: 'Tajawal', sans-serif;
          background-color: var(--bg-color);
          color: var(--text-color);
          margin: 0;
          padding: 2rem;

        }
        .container {
          max-width: 1200px;
          margin: auto;

          gap: 2rem;
        }

          background-color: var(--primary-color);
          color: white;

          font-family: 'Tajawal', sans-serif;
          transition: background-color 0.3s;
        }

        /* New Detailed Analysis Styles */
        .axis-detail-container {
            border-top: 1px solid #ddd;

         @media (max-width: 768px) {

  <body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Constants ---
        const AXIS_NAMES = {
          1: 'مرحلة التخطيط لمهمة التدقيق الاجتماع الافتتاحي',
          2: 'مرحلة تنفيذ مهمة التدقيق الداخلي',
          3: 'مستوى الرضا عن الملاحظات والتقارير التدقيق',
          4: 'مستوى الرضا عن المدققين',
          5: 'الانطباع العام',
        };

        const QUESTION_CODE_TO_BAND_MAP = {
          '1-1': 'وضوح النطاق والاهداف',
          '1-2': 'وضوح طلبات التدقيق',
          '1-3': 'توقيت المهمة مناسب',
          '2-1': 'الانجاز بكفاءة وبالموعد',
          '2-2': 'تحقيق الأهداف',
          '2-3': 'عدم التاثير على الأنشطة',
          '2-4': 'التواصل المستمر للنتائج',
          '3-1': 'وضوح التقارير وتوقيتها',
          '3-2': 'أهمية التوصيات',
          '3-3': 'مناقشة النتائج واستيعاب الآراء',
          '3-4': 'تحسين التوصيات للمخاطر',
          '4-1': 'الاهتمام والكفاءة',
          '4-2': 'التركيز على المخاطر',
          '4-3': 'السلوك المهني',
          '4-4': 'الالتزام بسلوكيات الشركة',
          '4-5': 'طلب مساعدة التدقيق',
          '5-1': 'تحقق عام للقيمة المضافة',
        };

        // --- Main App Component ---
        const App = () => {
          const [reportData, setReportData] = useState(null);
          const [error, setError] = useState(null);
          const [isLoading, setIsLoading] = useState(false);
          const [fileName, setFileName] = useState('');
          const fileInputRef = useRef(null);

          useEffect(() => {
            if (window.Chart && window.Chart.registerables) {
               Chart.register(...Chart.registerables);
            }
          }, []);

          // Helper function to normalize Arabic text for more flexible matching
          const normalizeArabic = (text) => {
            if (typeof text !== 'string') return '';
            // Replaces different forms of Alef with a plain Alef
            // Replaces Taa Marbuta with Haa
            return text
                .replace(/[\u0622\u0623\u0625]/g, '\u0627') // آ, أ, إ -> ا
                .replace(/\u0629/g, '\u0647'); // ة -> ه
          };

          const processData = (csvData) => {
            setIsLoading(true);
            setError(null);
            try {
              const lines = csvData.trim().split('\n');
               if (lines.length < 2) {
                throw new Error("الملف يجب أن يحتوي على صف الرأس وصف بيانات واحد على الأقل.");
              }

              const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
              const dataRows = lines.slice(1);
              
              // Normalize headers for flexible matching (case-insensitive and Arabic character variations)
              const normalizedHeaders = headers.map(h => normalizeArabic(h.toLowerCase()));
              const normalizedArabicDepartmentHeader = normalizeArabic("اسم الادارة");
              const normalizedArabicPositionHeader = normalizeArabic("الوظيفة");
              const englishDepartmentHeader = 'depart';
              const englishPositionHeader = 'jop';

              // Find the indices of the required columns by their normalized names
              const departmentIndex = normalizedHeaders.findIndex(h => h === normalizedArabicDepartmentHeader || h === englishDepartmentHeader);
              const positionIndex = normalizedHeaders.findIndex(h => h === normalizedArabicPositionHeader || h === englishPositionHeader);
              const companyIndex = headers.findIndex(h => h.toLowerCase() === 'slognsu');


              // Validate that required columns are present
              const missingCols = [];
              if (companyIndex === -1) missingCols.push('"SlognSu"');
              if (departmentIndex === -1) missingCols.push('"اسم الادارة" أو "Depart"');
              if (positionIndex === -1) missingCols.push('"الوظيفة" أو "Jop"');
              
              if (missingCols.length > 0) {
                  throw new Error(`لم يتم العثور على الأعمدة المطلوبة: ${missingCols.join('، ')}. يرجى التأكد من وجودها في الملف.`);
              }
              
              const metaDataIndices = new Set([companyIndex, departmentIndex, positionIndex]);

              const SCORE_MAP = {
                // 5 - Strongly Agree
                'اوافق بشدة': 5,
                'أوافق بشدة': 5,
                'موافق بشدة': 5,

                // 4 - Agree
                'أوافق': 4,
                'اوافق': 4,
                'موافق': 4,

                // 3 - Neutral
                'محايد': 3,

                // 2 - Disagree
                'غير أوافق': 2,
                'غير اوافق': 2,
                'غير موافق': 2,
                
                // 1 - Strongly Disagree
                'غير أوافق بشدة': 1,
                'غير اوافق بشدة': 1,
                'غير موافق بشدة': 1,
              };
              
              const responses = [];

              dataRows.forEach(row => {
                const values = row.split(',').map(v => v.trim().replace(/"/g, ''));
                if (values.length !== headers.length) return; // Skip malformed rows

                const company = values[companyIndex];
                const department = values[departmentIndex];
                const position = values[positionIndex];

                if (!department) return;

                headers.forEach((header, index) => {
                    // If the current column is not a metadata column, treat it as a question
                    if (!metaDataIndices.has(index)) {
                        const value = values[index];
                        const questionCodeMatch = header.match(/^(\d-\d+)/); 
                        const score = SCORE_MAP[value];

                        if (questionCodeMatch && score !== undefined) {
                            const axis = parseInt(questionCodeMatch[0].split('-')[0], 10);
                            const questionCode = questionCodeMatch[0];
                            responses.push({
                                company,
                                department,
                                position,
                                axis,
                                question: header,
                                questionCode: questionCode,
                                score,
                            });
                        }
                    }
                });
              });

              if (responses.length === 0) {
                throw new Error("لم يتم العثور على بيانات قابلة للتحليل. يرجى التحقق من تنسيق الملف ومحتواه.");
              }

              // يتم استخلاص قائمة فريدة بأسماء الإدارات المشاركة من عمود "Depart".
              const participants = [...new Set(responses.map(r => r.department))];
              const positions = [...new Set(responses.map(r => r.position))];

              const totalResponses = responses.length;
              const satisfactionCount = responses.filter(r => r.score >= 4).length;
              const neutralCount = responses.filter(r => r.score === 3).length;
              const dissatisfactionCount = responses.filter(r => r.score <= 2).length;

              const departmentScores = {};
              participants.forEach(p => {
                departmentScores[p] = { 1: [], 2: [], 3: [], 4: [], 5: [] };
              });
              responses.forEach(r => {
                if (departmentScores[r.department] && departmentScores[r.department][r.axis]) {
                  departmentScores[r.department][r.axis].push(r.score);
                }
              });
              
              const departmentStats = participants.map(p => {
                let totalScore = 0;
                let totalCount = 0;
                const axisAverages = {};
                for (let i = 1; i <= 5; i++) {
                  const scores = departmentScores[p][i];
                  if(scores.length > 0) {
                    const sum = scores.reduce((a, b) => a + b, 0);
                    axisAverages[i] = sum / scores.length;
                    totalScore += sum;
                    totalCount += scores.length;
                  } else {
                    axisAverages[i] = 0; // Represents no data for this axis
                  }
                }
                return {
                  department: p,
                  overallAverage: totalCount > 0 ? totalScore / totalCount : 0,
                  axisAverages,
                };
              });

              departmentStats.sort((a, b) => a.overallAverage - b.overallAverage);

              const lowestPerformingDepartments = departmentStats.slice(0, 2);
              const lowestDepartmentNames = lowestPerformingDepartments.map(d => d.department);

              const overallAxisStats = [];
              for (let i = 1; i <= 5; i++) {
                const allScoresForAxis = responses.filter(r => r.axis === i && !lowestDepartmentNames.includes(r.department)).map(r => r.score);
                const sum = allScoresForAxis.reduce((a, b) => a + b, 0);
                overallAxisStats.push({
                  axis: i,
                  axisName: AXIS_NAMES[i],
                  average: allScoresForAxis.length > 0 ? sum / allScoresForAxis.length : 0,
                });
              }

              const axisFocusPoints = [];
              for (let i = 1; i <= 5; i++) {
                let minScore = 5.1; // Start higher than max score
                departmentStats.forEach(dept => {
                  const score = dept.axisAverages[i];
                  // Only consider valid scores (not 0, which means no data for that department)
                  if (score > 0 && score < minScore) {
                    minScore = score;
                  }
                });
                
                if (minScore <= 5) { // Check if a valid minimum was found
                    axisFocusPoints.push({
                      axis: i,
                      axisName: AXIS_NAMES[i],
                      score: minScore,
                    });
                }
              }

              // --- New: Detailed Axis Analysis ---
              const detailedAxisAnalysis = {};
              for (let i = 1; i <= 5; i++) {
                const axisResponses = responses.filter(r => r.axis === i);
                if (axisResponses.length === 0) continue;

                const totalAxisResponses = axisResponses.length;
                const satisfactionCount = axisResponses.filter(r => r.score >= 4).length;
                const neutralCount = axisResponses.filter(r => r.score === 3).length;
                const dissatisfactionCount = axisResponses.filter(r => r.score <= 2).length;
                
                const questionGroups = {};
                axisResponses.forEach(r => {
                    if (!questionGroups[r.questionCode]) {
                        questionGroups[r.questionCode] = { scores: [], fullText: r.question };
                    }
                    questionGroups[r.questionCode].scores.push(r.score);
                });

                const questionStats = Object.keys(questionGroups).map(questionCode => {
                    const scores = questionGroups[questionCode].scores;
                    const sum = scores.reduce((a, b) => a + b, 0);
                    const shortText = QUESTION_CODE_TO_BAND_MAP[questionCode] || questionCode;
                    return {
                        questionText: shortText,
                        fullQuestionText: questionGroups[questionCode].fullText,
                        averageScore: sum / scores.length,
                    };
                });
                
                const sortedQuestions = [...questionStats].sort((a, b) => a.averageScore - b.averageScore);
                const lowestQuestion = sortedQuestions[0];
                const highestQuestion = sortedQuestions[sortedQuestions.length - 1];

                detailedAxisAnalysis[i] = {
                    axis: i,
                    axisName: AXIS_NAMES[i],
                    satisfactionRate: (satisfactionCount / totalAxisResponses) * 100,
                    neutralRate: (neutralCount / totalAxisResponses) * 100,
                    dissatisfactionRate: (dissatisfactionCount / totalAxisResponses) * 100,
                    questionStats: questionStats,
                    analysis: `أظهرت نتائج ${AXIS_NAMES[i]} من أصل ${totalAxisResponses} استجابة، أن نسبة الرضا الإجمالية بلغت ${(satisfactionCount / totalAxisResponses * 100).toFixed(0)}%. كانت أعلى نقاط القوة في "${highestQuestion.questionText}" بمتوسط تقييم ${highestQuestion.averageScore.toFixed(2)}، بينما كانت أبرز فرصة للتحسين في "${lowestQuestion.questionText}" بمتوسط تقييم ${lowestQuestion.averageScore.toFixed(2)}.`,
                    improvement: `ينصح بالتركيز على تحسين الجوانب المتعلقة بـ "${lowestQuestion.questionText}" وتعزيز الممارسات الإيجابية المتعلقة بـ "${highestQuestion.questionText}".`
                };
              }

              setReportData({
                participants,
                positions,
                satisfactionRate: (satisfactionCount / totalResponses) * 100,
                neutralRate: (neutralCount / totalResponses) * 100,
                dissatisfactionRate: (dissatisfactionCount / totalResponses) * 100,
                overallAxisStats,
                lowestPerformingDepartments: lowestPerformingDepartments,
                axisFocusPoints: axisFocusPoints,
                detailedAxisAnalysis: detailedAxisAnalysis,
              });

            } catch (e) {
              const errorMessage = (e instanceof Error) ? e.message : "حدث خطأ غير معروف.";
              setError(`فشلت معالجة الملف. ${errorMessage} يرجى التأكد من أن الملف بصيغة XLSX، ويحتوي على الأعمدة المطلوبة بأحد الأسماء التالية: "SlognSu", "اسم الادارة" (أو "Depart"), "الوظيفة" (أو "Jop").`);
              setReportData(null);
            } finally {
              setIsLoading(false);
            }
          };

          const handleFileChange = (event) => {
            const file = event.target.files?.[0];
            if (file) {
              // For a better user experience, reset the report state when a new file is selected.
              // This clears any previous report or errors from the screen.
              setReportData(null);
              setError(null);

              // Immediately update the UI with the new file name and loading indicator.
              setFileName(file.name);
              setIsLoading(true);

              const reader = new FileReader();
              reader.onload = (e) => {
                try {
                  const data = e.target?.result;
                  const workbook = XLSX.read(data, { type: 'array' });
                  const sheetName = workbook.SheetNames[0];
                  const worksheet = workbook.Sheets[sheetName];
                  const csvData = XLSX.utils.sheet_to_csv(worksheet);
                  processData(csvData);
                } catch (err) {
                    setError('حدث خطأ أثناء قراءة ملف XLSX. يرجى التأكد من أن الملف غير تالف وبالتنسيق الصحيح.');
                    setReportData(null);
                    setIsLoading(false);
                }
              };
              reader.onerror = () => {
                  setError('فشل قراءة الملف. يرجى المحاولة مرة أخرى.');
                  setIsLoading(false);
              };
              reader.readAsArrayBuffer(file);
            }
          };

          const loadExampleData = () => {
              const exampleCSV = `SlognSu,Depart,Jop,"1-1كانت أهداف التدقيق ونطاقه واضحة ومفهومة ومتفق عليها","1-2طلبات التدقيق كانت واضحة بشكل كافي","1-3توقيت مهمة التدقيق الداخلي كان مناسب","2-1تم انجاز عملية التدقيق بكفاءة وفعالية بكل مراحل التدقيق","2-2تم تحقيق الأهداف المتفق عليها مع التدقيق الداخلي","2-3أثناء عملية التدقيق تم مراعاة عدم التأثير لسير الأنشطة اليومية","2-4تم اطلاعكم بنتائج عمليات التدقيق وابلاغكم بها طول فترة التدقيق","3-1كان تقرير التدقيق الداخلي دقيقا وتم إبلاغ النتائج بوضوح","3-2تم توضيح أهمية التوصيات (خطة عمل الادارة) الواردة في تقارير","3-3تم مناقشة نتائج تقرير التدقيق الداخلي وتم توضيحها للمختصين","3-4أعتبر ان تقرير التدقيق الداخلي وتوصياته قد ساهم في تحسين الرقابة","4-1المدققين اظهروا اهتماما بعمل الشركة وكانوا ذو كفاءه ومهارة جيدة","4-2المدققين فهموا تفاصيل عمل الشركة واستوعبوا العناصر الأساسية","4-3أظهر المدققون السلوك المهني والاحترام للعاملين بالشركة","4-4المدققين اظهروا مستوي عالي من الانضباط والالتزام بقواعد وسلوكيات","4-5سوف أطلب المساعدة من افراد التدقيق في حالة وجود موقف يستدعي","5-1فعلا التدقيق الداخلي قدم قيمه مضافه للشركة من مجمل المهام","أكثر الجوانب الإيجابية","أكثر الجوانب السلبية"
"الشركة القابضة","التخطيط","مدير إدارة","محايد","أوافق","محايد","غير أوافق","محايد","غير أوافق","أوافق","محايد","غير أوافق","محايد","غير أوافق","اوافق بشدة","اوافق بشدة","أوافق","اوافق بشدة","أوافق","محايد","التعاون","التأخر في الرد"
"الشركة القابضة","الإدارة العامة","مدير إدارة","اوافق بشدة","أوافق","اوافق بشدة","أوافق","اوافق بشدة","أوافق","اوافق بشدة","أوافق","أوافق","اوافق بشدة","أوافق","اوافق بشدة","اوافق بشدة","اوافق بشدة","اوافق بشدة","اوافق بشدة","اوافق بشدة","الاحترافية","لا يوجد"
"الشركة القابضة","مالية الشركات","مدير إدارة","أوافق","أوافق","محايد","محايد","أوافق","أوافق","أوافق","أوافق","محايد","محايد","أوافق","اوافق بشدة","أوافق","اوافق بشدة","أوافق","اوافق بشدة","أوافق","الوضوح","بعض الملاحظات غير دقيقة"
`;
              setFileName("بيانات تجريبية.xlsx");
              processData(exampleCSV);
          }

          const resetState = () => {
            setReportData(null);
            setError(null);
            setFileName('');
            if (fileInputRef.current) {
              fileInputRef.current.value = '';
            }
          };

          return (
            <div className="container">
              <header className="card header-card">
                <h1>تقرير تحليل رضا العملاء</h1>
                <p>أداة تحليل نتائج استبيان قياس رضا العملاء عن خدمات التدقيق الداخلي</p>
                <div className="file-controls">
                  <input type="file" ref={fileInputRef} onChange={handleFileChange} accept=".xlsx, .xls" style={{ display: 'none' }} id="file-upload" />
                  <label htmlFor="file-upload" className="btn">
                    استيراد ملف XLSX
                  </label>
                  <button className="btn btn-secondary" onClick={loadExampleData}>تحميل بيانات تجريبية</button>
                  {fileName && <button className="btn btn-secondary" onClick={resetState}>تقرير جديد</button>}
                </div>
                {fileName && <p className="file-name">الملف الحالي: {fileName}</p>}
              </header>

              {isLoading && <div className="loading-indicator">جاري معالجة البيانات...</div>}
              {error && <div className="card error-message">{error}</div>}

              {reportData && (
                <>
                  <ReportIntroduction />
                  <ParticipantsCard participants={reportData.participants} positions={reportData.positions} />
                  <GeneralStatsCard data={reportData} />
                  <FocusAreaCard data={reportData} />
                  <DetailedAnalysisCard data={reportData.detailedAxisAnalysis} />
                </>
              )}
            </div>
          );
        };

        const ReportIntroduction = () => (
          <div className="card">
            <h2>1) مقدمة التقرير</h2>
            <p><strong>الهدف:</strong> يهدف هذا التقرير إلى تحليل وتقييم مستوى رضا مدراء الإدارات او الإدارة العليا من خلال رابط الاستبيان المرسل عبر الايميل، وذلك بناءً على البيانات التي تم جمعها.</p>
            <p><strong>التقييم العام:</strong> يُظهر الأداء العام لوظيفة التدقيق الداخلي التزامًا عاليًا بالمعايير المهنية، وتركيزاً على إضافة القيمة للشركة والمساهمة في تحسين العمليات، وتأكيداً على أن معظم الأنشطة التشغيلية تتم ضمن إطار رقابي جيد.</p>
            <p><strong>الإيجابيات البارزة:</strong> كان هناك تقدير لـ المهنية والتعاون من قبل الإدارات التي تم تدقيقها، مما يعكس علاقة عمل إيجابية ومُحفزة للتطوير الداخلي المستمر.</p>
            <p><strong>مجالات تتطلب للتحسين:</strong> لوحظت حاجة ملحة لتعزيز إجراءات التواصل والتحقق من الملاحظات قبل عرضها على المستويات العليا، لضمان دقة البيانات المعروضة في الاجتماعات.</p>
          </div>
        );

        const ParticipantsCard = ({ participants, positions }) => (
            <div className="card">
              <h2>2) المشاركون في الاستبيان</h2>
              <div className="participants-summary-table">
                  <table>
                      <tbody>
                          <tr>
                              <td>مناصب المشاركين (المستهدفة)</td>
                              <td><strong>مدراء الإدارات / الإدارة العليا</strong></td>
                          </tr>
                          <tr>
                              <td>الإدارات المشاركة ({participants.length} إدارة)</td>
                              <td><strong>{participants.join('، ')}</strong></td>
                          </tr>
                          {positions && positions.length > 0 && (
                            <tr>
                                <td>الوظائف المشاركة ({positions.length} وظيفة)</td>
                                <td><strong>{positions.join('، ')}</strong></td>
                            </tr>
                          )}
                      </tbody>
                  </table>
              </div>
            </div>
          );

        const GeneralStatsCard = ({ data }) => (
          <div className="card">
            <h2>3) الإحصائية العامة لنتائج الاستبيان</h2>
            <div className="stats-grid">
              <div className="stat-item stat-green">
                <div className="value">{data.satisfactionRate.toFixed(1)}%</div>
                <div className="label">مستوى الرضا العام</div>
              </div>
              <div className="stat-item stat-yellow">
                <div className="value">{data.neutralRate.toFixed(1)}%</div>
                <div className="label">نسبة المحايدين</div>
              </div>
              <div className="stat-item stat-red">
                <div className="value">{data.dissatisfactionRate.toFixed(1)}%</div>
                <div className="label">غير راضين</div>
              </div>
            </div>
          </div>
        );

        const FocusAreaCard = ({ data }) => {
            return (
                <div className="card">
                    <h2>4) نقاط التحسين (منطقة التركيز)</h2>
                    <div className="focus-area-grid">
                        <div className="chart-container">
                            <RadarChart data={data} />
                        </div>
                        <div className="analysis-text">
                            <p>يُظهر الرسم البياني مقارنة بين المتوسط العام وأداء الإدارات الأقل تقييمًا بشكل إجمالي. لتحديد نقاط الضعف المحددة، توضح القائمة التالية أقل متوسط تقييم تم تسجيله في كل محور من المحاور الخمسة عبر جميع الإدارات المشاركة:</p>
                            
                            {data.axisFocusPoints && data.axisFocusPoints.length > 0 ? (
                                <ul>
                                    {data.axisFocusPoints.map((point) => (
                                        <li key={point.axis}>
                                            <span>{point.axisName}:</span> 
                                            <strong>{point.score.toFixed(2)}</strong>
                                        </li>
                                    ))}
                                </ul>
                            ) : (
                                <p>لا توجد بيانات كافية لتحديد نقاط التركيز.</p>
                            )}
                        </div>
                    </div>
                </div>
            );
        };
        
        const DetailedAnalysisCard = ({ data }) => {
            if (!data || Object.keys(data).length === 0) return null;

            return (
                <div className="card">
                    <h2>5) التحليل التفصيلي للمعايير</h2>
                    {Object.values(data).map(axisData => (
                        <AxisDetailRow key={axisData.axis} data={axisData} />
                    ))}
                </div>
            );
        };

        const AxisDetailRow = ({ data }) => {
            return (
                <div className="axis-detail-container">
                    <h3>المحور {data.axis}: {data.axisName}</h3>
                    <div className="axis-detail-grid">
                        <div className="axis-text-analysis">
                            <h4>التحليل</h4>
                            <p>{data.analysis}</p>
                            <h4>التحسين</h4>
                            <p>{data.improvement}</p>
                        </div>
                        <div className="axis-bar-chart">
                            <h5>متوسط تقييم بنود المحور</h5>
                            <div className="axis-chart-container">
                                <AxisBarChart data={data.questionStats} />
                            </div>
                        </div>
                        <div className="axis-doughnut-chart">
                            <h5>الرضا عن {data.axisName}</h5>
                            <div className="axis-chart-container">
                                <AxisDoughnutChart data={data} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AxisBarChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && data) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }

                    const labels = data.map(q => q.questionText);
                    const scores = data.map(q => q.averageScore);
                    
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'متوسط التقييم',
                                data: scores,
                                backgroundColor: 'rgba(0, 121, 107, 0.8)',
                                borderColor: 'rgba(0, 121, 107, 1)',
                                borderWidth: 1,
                            }]
                        },
                        options: {
                            indexAxis: 'y',
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    beginAtZero: true,
                                    suggestedMax: 5
                                },
                                y: {
                                    ticks: {
                                        font: {
                                            size: 11
                                        }
                                    }
                                }
                            },
                            plugins: {
                                legend: { display: false },
                                tooltip: {
                                    callbacks: {
                                        title: (tooltipItems) => {
                                             return data[tooltipItems[0].dataIndex].fullQuestionText;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);

            return <canvas ref={chartRef} />;
        };


        const AxisDoughnutChart = ({ data }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {
                if (chartRef.current && data) {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                    
                    chartInstance.current = new Chart(chartRef.current, {
                        type: 'doughnut',
                        data: {
                            labels: ['موافق', 'محايد', 'غير موافق'],
                            datasets: [{
                                data: [data.satisfactionRate, data.neutralRate, data.dissatisfactionRate],
                                backgroundColor: [
                                    '#4CAF50', // green
                                    '#FFC107', // yellow
                                    '#F44336', // red
                                ],
                                hoverOffset: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: {
                                        boxWidth: 12,
                                        font: {
                                            size: 12
                                        }
                                    }
                                },
                                tooltip: {
                                    callbacks: {
                                        label: function(context) {
                                            let label = context.label || '';
                                            if (label) {
                                                label += ': ';
                                            }
                                            if (context.parsed !== null) {
                                                label += context.parsed.toFixed(1) + '%';
                                            }
                                            return label;
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
                return () => {
                    if (chartInstance.current) {
                        chartInstance.current.destroy();
                    }
                };
            }, [data]);
            
            return <canvas ref={chartRef} />;
        };


        const RadarChart = ({ data }) => {
          const chartRef = useRef(null);
          const chartInstance = useRef(null);

          useEffect(() => {
            if (chartRef.current) {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
              
              const labels = data.overallAxisStats.map(s => s.axisName);
              const avgData = data.overallAxisStats.map(s => s.average);
              const dept1Data = data.lowestPerformingDepartments[0] ? Object.values(data.lowestPerformingDepartments[0].axisAverages) : [];
              const dept2Data = data.lowestPerformingDepartments[1] ? Object.values(data.lowestPerformingDepartments[1].axisAverages) : [];
              
              const pointStyles = { avg: [], dept1: [], dept2: [] };
              const pointRadii = { avg: [], dept1: [], dept2: [] };
              
              for (let i = 0; i < labels.length; i++) {
                const scores = [];
                if (avgData[i] > 0) scores.push(avgData[i]);
                if (dept1Data.length > 0 && dept1Data[i] > 0) scores.push(dept1Data[i]);
                if (dept2Data.length > 0 && dept2Data[i] > 0) scores.push(dept2Data[i]);
                
                let minScore = Infinity;
                if(scores.length > 0) {
                    minScore = Math.min(...scores);
                }

                // Set styles for each dataset point on this axis
                pointStyles.avg.push(avgData[i] === minScore ? 'triangle' : 'circle');
                pointRadii.avg.push(avgData[i] === minScore ? 6 : 3);

                pointStyles.dept1.push(dept1Data.length > 0 && dept1Data[i] === minScore ? 'triangle' : 'circle');
                pointRadii.dept1.push(dept1Data.length > 0 && dept1Data[i] === minScore ? 6 : 3);
                
                pointStyles.dept2.push(dept2Data.length > 0 && dept2Data[i] === minScore ? 'triangle' : 'circle');
                pointRadii.dept2.push(dept2Data.length > 0 && dept2Data[i] === minScore ? 6 : 3);
              }

              const datasets = [{
                label: 'متوسط الرضا العام',
                data: avgData,
                backgroundColor: 'transparent',
                borderColor: 'rgba(76, 175, 80, 1)',
                borderWidth: 4,
                pointBackgroundColor: 'rgba(76, 175, 80, 1)',
                pointStyle: pointStyles.avg,
                pointRadius: pointRadii.avg,
              }];

              if (data.lowestPerformingDepartments[0]) {
                  const dep = data.lowestPerformingDepartments[0];
                  datasets.push({
                      label: `أقل تقييم 1 (${dep.department})`,
                      data: dept1Data,
                      backgroundColor: 'transparent',
                      borderColor: 'rgba(244, 67, 54, 1)',
                      borderWidth: 4,
                      pointBackgroundColor: 'rgba(244, 67, 54, 1)',
                      pointStyle: pointStyles.dept1,
                      pointRadius: pointRadii.dept1,
                  });
              }
              
              if (data.lowestPerformingDepartments[1]) {
                  const dep = data.lowestPerformingDepartments[1];
                  datasets.push({
                      label: `أقل تقييم 2 (${dep.department})`,
                      data: dept2Data,
                      backgroundColor: 'transparent',
                      borderColor: 'rgba(255, 152, 0, 1)',
                      borderWidth: 4,
                      pointBackgroundColor: 'rgba(255, 152, 0, 1)',
                      pointStyle: pointStyles.dept2,
                      pointRadius: pointRadii.dept2,
                  });
              }

              chartInstance.current = new Chart(chartRef.current, {
                type: 'radar',
                data: {
                  labels: labels,
                  datasets: datasets,
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: true,
                  scales: {
                    r: {
                      angleLines: {
                        display: true,
                        lineWidth: 2.5,
                        color: '#aaaaaa',
                      },
                      grid: {
                        lineWidth: 2.5,
                        color: '#aaaaaa',
                      },
                      suggestedMin: 1,
                      suggestedMax: 5,
                      pointLabels: {
                        font: {
                            family: "'Tajawal', sans-serif",
                            size: 14,
                        },
                        color: 'black',
                      },
                      ticks: {
                        stepSize: 1,
                        color: 'black',
                        font: {
                            size: 16,
                            weight: 'bold',
                        },
                        callback: function(value) {
                            return String(value);
                        }
                      }
                    },
                  },
                  plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                family: "'Tajawal', sans-serif"
                            }
                        }
                    },
                    tooltip: {
                        bodyFont: {
                          family: "'Tajawal', sans-serif"
                        },
                        titleFont: {
                          family: "'Tajawal', sans-serif"
                        }
                    }
                  }
                },
              });
            }
            return () => {
              if (chartInstance.current) {
                chartInstance.current.destroy();
              }
            };
          }, [data]);

          return <canvas ref={chartRef} />;
        };


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
